<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" role="img" aria-label="throughput vs concurrency">
<title>Throughput and per-stream rate vs concurrency</title>
<rect width="100%" height="100%" fill="white"/>
<line x1="70" y1="410" x2="700" y2="410" stroke="#ddd"/><text x="62" y="414" font-size="11" text-anchor="end" fill="#444">0</text>
<line x1="70" y1="336" x2="700" y2="336" stroke="#ddd"/><text x="62" y="340" font-size="11" text-anchor="end" fill="#444">4.08</text>
<line x1="70" y1="262" x2="700" y2="262" stroke="#ddd"/><text x="62" y="266" font-size="11" text-anchor="end" fill="#444">8.16</text>
<line x1="70" y1="188" x2="700" y2="188" stroke="#ddd"/><text x="62" y="192" font-size="11" text-anchor="end" fill="#444">12.2</text>
<line x1="70" y1="114" x2="700" y2="114" stroke="#ddd"/><text x="62" y="118" font-size="11" text-anchor="end" fill="#444">16.3</text>
<line x1="70" y1="40" x2="700" y2="40" stroke="#ddd"/><text x="62" y="44" font-size="11" text-anchor="end" fill="#444">20.4</text>
<line x1="70" y1="410" x2="700" y2="410" stroke="#333"/>
<text x="360.0" y="462" font-size="13" text-anchor="middle">concurrency (parallel requests)</text>
<text x="16" y="240.0" font-size="13" transform="rotate(-90 16 240.0)" text-anchor="middle">tok/s</text>
<polyline points="70.0,95.9 273.3,91.9 680.0,88.3" fill="none" stroke="#0072B2" stroke-width="2"/>
<polyline points="70.0,95.9 273.3,171.6 680.0,276.1" fill="none" stroke="#E69F00" stroke-width="2" stroke-dasharray="5,3"/>
<circle cx="70.0" cy="95.9" r="5" fill="#0072B2"><title>aggregate: 17.3 tok/s (n=2 runs)</title></circle>
<circle cx="70.0" cy="95.9" r="4" fill="#E69F00"><title>per-stream: 17.3 tok/s</title></circle>
<circle cx="273.3" cy="91.9" r="5" fill="#0072B2"><title>aggregate: 17.5 tok/s (n=2 runs)</title></circle>
<circle cx="273.3" cy="171.6" r="4" fill="#E69F00"><title>per-stream: 13.1 tok/s</title></circle>
<circle cx="680.0" cy="88.3" r="5" fill="#0072B2"><title>aggregate: 17.7 tok/s (n=2 runs)</title></circle>
<circle cx="680.0" cy="276.1" r="4" fill="#E69F00"><title>per-stream: 7.4 tok/s</title></circle>
<text x="570" y="22" font-size="12" fill="#0072B2">aggregate tok/s</text>
<text x="570" y="38" font-size="12" fill="#E69F00">per-stream tok/s</text>
</svg>